suite: Controller > KEDA
templates:
  - controller-keda.yaml

tests:
  - it: should create a ScaledObject if `controller.keda.enabled` is true
    set:
      controller.keda.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledObject
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-controller

  - it: should not create a ScaledObject if `controller.keda.enabled` is true and `controller.autoscaling.enabled` is true
    set:
      controller.keda.enabled: true
      controller.autoscaling.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a ScaledObject if `controller.kind` is "DaemonSet"
    set:
      controller.kind: DaemonSet
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a ScaledObject with a fallback without behavior if `controller.keda.fallback.behavior` is not set
    set:
      controller.keda.enabled: true
      controller.keda.fallback:
        failureThreshold: 5
        replicas: 4
    asserts:
      - equal:
          path: spec.fallback
          value:
            failureThreshold: 5
            replicas: 4

  - it: should create a ScaledObject with a fallback behavior if `controller.keda.fallback.behavior` is set
    set:
      controller.keda.enabled: true
      controller.keda.fallback:
        replicas: 2
        behavior: currentReplicasIfHigher
    asserts:
      - equal:
          path: spec.fallback
          value:
            failureThreshold: 3
            replicas: 2
            behavior: currentReplicasIfHigher

